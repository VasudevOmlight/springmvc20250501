<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title.edit}">Редагувати товар</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
<div class="container">
    <div class="header-container">
        <div class="language-switcher">
            <a th:href="@{/products/edit/{id}(id=${product.id}, language='en')}" th:text="EN"></a> |
            <a th:href="@{/products/edit/{id}(id=${product.id}, language='de')}" th:text="DE"></a> |
            <a th:href="@{/products/edit/{id}(id=${product.id}, language='fr')}" th:text="FR"></a> |
            <a th:href="@{/products/edit/{id}(id=${product.id}, language='uk')}" th:text="UA"></a>
        </div>
        <h1><span th:text="#{page.title.edit}">Редагувати товар</span></h1>
        <div class="language-switcher-placeholder"></div> </div>

    <span id="productData" th:data-product-id="${product.id}" style="display: none;"></span>

    <div th:if="${error}" class="error-message" th:text="${error}"></div>

    <form th:if="${product != null}" th:action="@{/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label><span th:text="#{table.header.id}">ID товару:</span> <span th:text="${product.id}"></span></label>
        </div>

        <div class="form-group">
            <label for="name"><span th:text="#{form.label.name}">Назва:</span></label>
            <input type="text" id="name" th:field="*{name}" class="form-control">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="error"></span>
        </div>
        <div class="form-group">
            <label for="description"><span th:text="#{form.label.description}">Опис:</span></label>
            <textarea id="description" th:field="*{description}" class="form-control"></textarea>
            <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}" class="error"></span>
        </div>
        <div class="form-group">
            <label for="price"><span th:text="#{form.label.price}">Ціна:</span></label>
            <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control">
            <span th:if="${#fields.hasErrors('price')}" th:errors="*{price}" class="error"></span>
        </div>
        <div class="form-group">
            <label for="amount"><span th:text="#{form.label.amount}">Кількість:</span></label>
            <input type="number" id="amount" th:field="*{amount}" class="form-control">
            <span th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}" class="error"></span>
        </div>

        <div class="form-group">
            <label><span th:text="#{form.label.currentImages}">Поточні зображення:</span></label>
            <div th:if="${product.images == null || product.images.isEmpty()}" class="no-images" th:text="#{no.images}">Зображень немає</div>

            <div th:unless="${product.images == null || product.images.isEmpty()}" class="image-gallery">
                <div class="gallery-container">
                    <div class="large-image-container">
                        <img id="largeEditImage"
                             src=""
                             alt="Selected product image"
                             class="large-image">
                    </div>

                    <a id="deleteLargeImageButton"
                       href="#"
                       class="button delete-image-button"
                       th:text="#{button.deleteImage}"
                       th:onclick="'return confirm(\'' + #{confirm.deleteImage} + '\');'">Видалити</a>

                    <div class="thumbnail-container">
                        <img th:each="image, iterStat : ${product.images}"
                             th:src="${image.imagePath}"
                             th:alt="'Product image ' + ${iterStat.count}"
                             th:class="'thumbnail-image' + (${iterStat.first} ? ' active' : '')"
                             th:data-large-src="${image.imagePath}"
                             th:data-image-id="${image.id}"
                             onclick="displayEditImage(this)">
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="imageFiles"><span th:text="#{form.label.addImages}">Додати нові зображення (JPG/PNG, необов’язково):</span></label>
            <input type="file" id="imageFiles" name="imageFiles" multiple accept="image/jpeg,image/png" class="form-control">
        </div>
        <button type="submit" class="button" th:text="#{form.button.save}">Зберегти</button>
        <a th:href="@{/products}" class="button cancel" th:text="#{form.button.back}">Повернутися до списку</a>
    </form>
    <div th:unless="${product != null}">
        <p class="error-message" th:text="#{error.productNotFound}">Товар не знайдено.</p>
        <a th:href="@{/products}" class="button" th:text="#{form.button.back}">Повернутися до списку</a>
    </div>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const largeEditImage = document.getElementById('largeEditImage');
        const thumbnails = document.querySelectorAll('.thumbnail-image');
        const deleteLargeImageButton = document.getElementById('deleteLargeImageButton');
        // Отримуємо ID продукту з data-атрибута прихованого елемента
        const productDataElement = document.getElementById('productData');
        const productId = productDataElement ? productDataElement.dataset.productId : null;


        /**
         * Оновлює велике зображення та посилання для видалення при кліку на мініатюру.
         * @param {HTMLElement} thumbnailElement Елемент мініатюри, на який клікнули.
         */
        function displayEditImage(thumbnailElement) {
            const newSrc = thumbnailElement.getAttribute('data-large-src');
            const imageId = thumbnailElement.getAttribute('data-image-id');

            if (largeEditImage) {
                largeEditImage.src = newSrc;
            }

            // Оновлюємо посилання на кнопці видалення
            if (deleteLargeImageButton && imageId != null && productId != null) {
                deleteLargeImageButton.href = `/products/delete-image/${imageId}?productId=${productId}`;
                deleteLargeImageButton.style.display = ''; // Робимо кнопку видимою
            } else if (deleteLargeImageButton) {
                deleteLargeImageButton.style.display = 'none'; // Ховаємо кнопку, якщо немає зображення або product ID
            }

            // Оновлюємо активний клас на мініатюрах для підсвічування
            thumbnails.forEach(thumb => thumb.classList.remove('active'));
            thumbnailElement.classList.add('active');
        }

        // Додаємо обробники подій кліку до всіх мініатюр
        thumbnails.forEach(thumbnail => {
            thumbnail.addEventListener('click', () => {
                displayEditImage(thumbnail);
            });
        });

        // Ініціалізація: встановлюємо перше зображення як велике та оновлюємо посилання видалення при завантаженні сторінки
        const firstThumbnail = document.querySelector('.thumbnail-image.active');
        if (firstThumbnail) {
            displayEditImage(firstThumbnail);
        } else {
            // Якщо зображень немає взагалі, ховаємо контейнер великого зображення та кнопку видалення
            if (largeEditImage) largeEditImage.style.display = 'none';
            if (deleteLargeImageButton) deleteLargeImageButton.style.display = 'none';
        }
    });
</script>
</body>
</html>
