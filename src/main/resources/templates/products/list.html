<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      lang="uk"> <head>
    <meta charset="UTF-8">
    <title th:text="#{page.title.list}">Список товарів</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body th:attr="data-locale=${#locale.toString()}">
<div class="container">
    <div class="header-container">
        <div class="language-switcher">
            <a th:href="@{/products(language='en', search=${search}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="EN"></a> |
            <a th:href="@{/products(language='de', search=${search}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="DE"></a> |
            <a th:href="@{/products(language='fr', search=${search}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="FR"></a> |
            <a th:href="@{/products(language='uk', search=${search}, sortBy=${sortBy}, sortDir=${sortDir})}" th:text="UA"></a>
        </div>
        <h1><span th:text="#{page.title.list}">Товари на складі</span></h1>

        <div class="auth-status">
            <div sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="button sign-in-button">
                    <span th:text="#{auth.signIn}">Sign In</span>
                </a>
            </div>
            <div sec:authorize="isAuthenticated()">
                <span th:text="#{auth.welcome}">Вітаю</span>, <span sec:authentication="name">User</span>!
                <form th:action="@{/logout}" method="post" style="display: inline;">
                    <button type="submit" class="button sign-out-button">
                        <span th:text="#{auth.signOut}">Вийти</span>
                    </button>
                </form>
            </div>
        </div>
        <div class="language-switcher-placeholder"></div>
    </div>

    <div class="controls-container">
        <form th:action="@{/products}" method="get" class="search-form server-search-form">
            <input type="text" id="searchInput" name="search" th:value="${search}" th:placeholder="#{search.placeholder}">
            <input type="hidden" name="sortBy" th:value="${sortBy}">
            <input type="hidden" name="sortDir" th:value="${sortDir}">
            <input type="hidden" name="language" th:value="${#locale.toString()}">
            <button type="submit" style="display: none;"></button> </form>
        <a th:href="@{/products/add}" class="button add-button-top" th:text="#{form.button.add}">Додати товар</a>
    </div>

    <table id="productTable">
        <thead>
        <tr>
            <th id="select-all-header" class="select-all-header">
                <span class="clickable-header-content" th:text="#{table.header.select}">Вибрати</span>
            </th>
            <th th:text="#{table.header.number}">№</th>
            <th th:text="#{table.header.id}">ID товару</th>
            <th>
                <a th:href="@{/products(search=${search}, sortBy='name', sortDir=${sortBy == 'name' and sortDir == 'asc' ? 'desc' : 'asc'}, language=${#locale.toString()})}" class="clickable-header-content">
                    <span th:text="#{table.header.name}">Назва</span>
                </a>
            </th>
            <th th:text="#{table.header.description}">Опис</th>
            <th>
                <a th:href="@{/products(search=${search}, sortBy='price', sortDir=${sortBy == 'price' and sortDir == 'asc' ? 'desc' : 'asc'}, language=${#locale.toString()})}" class="clickable-header-content">
                    <span th:text="#{table.header.price}">Ціна</span>
                </a>
            </th>
            <th>
                <a th:href="@{/products(search=${search}, sortBy='amount', sortDir=${sortBy == 'amount' and sortDir == 'asc' ? 'desc' : 'asc'}, language=${#locale.toString()})}" class="clickable-header-content">
                    <span th:text="#{table.header.amount}">Кількість</span>
                </a>
            </th>
            <th th:text="#{table.header.actions}">Дії</th>
        </tr>
        </thead>
        <tbody id="productTableBody">
        <tr th:each="product, iterStat : ${products}">
            <td>
                <input type="checkbox" class="product-checkbox" checked
                       th:data-price="${product.price}"
                       th:data-amount="${product.amount}"
                       th:data-raw-price="${product.price}"> </td>
            <td th:text="${iterStat.count}"></td>
            <td th:text="${product.id}" class="product-id"></td>
            <td th:text="${#strings.abbreviate(product.name, 15)}" th:title="${product.name}" class="product-name"></td>
            <td th:text="${#strings.abbreviate(product.description, 23)}" th:title="${product.description}" class="product-description"></td>
            <td class="product-price-cell" th:text="${product.price}"></td>
            <td th:text="${product.amount}"></td>
            <td>
                <a th:href="@{/products/view/{id}(id=${product.id})}" th:text="#{button.view}">Переглянути</a> |
                <span>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" th:text="#{button.edit}">Редагувати</a> |
                    <a th:href="@{/products/delete/{id}(id=${product.id})}"
                       th:text="#{button.delete}"
                       th:onclick="'return confirm(\'' + #{confirm.delete} + '\');'">Видалити</a>
                </span>
            </td>
        </tr>
        </tbody>
    </table>

    <h2 class="summary-title"><span th:text="#{summary.title}">Підсумок за вибраними видимими позиціями</span></h2>
    <table class="summary-table">
        <thead>
        <tr>
            <th th:text="#{summary.header.positions}">Кількість вибраних позицій</th>
            <th th:text="#{summary.header.units}">Кількість одиниць у вибраних</th>
            <th th:text="#{summary.header.value}">Загальна вартість вибраних</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td id="selected-positions">0</td>
            <td id="selected-units">0</td>
            <td id="selected-value">0.00</td>
        </tr>
        </tbody>
    </table>

</div>
<script src="/js/script.js"></script>
</body>
</html>
